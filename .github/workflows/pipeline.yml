name: JP225 Live Grid Engine

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  quantum_grid:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: 1. Fetch Live Market Data (cTrader)
        run: python src/data.py

      - name: 2. Run AI Prediction Engine
        run: python src/predict.py
        
      - name: 3. Run Grid State Validator
        run: python src/validator.py
